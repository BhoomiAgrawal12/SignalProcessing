<svg xmlns="http://www.w3.org/2000/svg" width="664" height="356" viewBox="0 0 664 356" role="img" aria-label="Bit-layer frames recovered per interleaver and FEC family"><style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
